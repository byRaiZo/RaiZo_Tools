// Создано KR Quick Test Server — отладочный конфиг по умолчанию
// Полный набор параметров по официальной вики (DayZ:Server_Configuration);
// отмеченные "для отладки" — осознанные отличия от официальных значений по умолчанию.
hostname = "{NAME}";                    // Название сервера
maxPlayers = 10;                        // Максимум игроков (для отладки много не нужно, офиц. умолч. 60)
description = "{NAME}";                 // Описание сервера в браузере (до 255 симв.)
password = "";                          // Пароль для входа
passwordAdmin = "";                     // Пароль администратора (#login)
enableDebugMonitor = 0;                 // Отладочный монитор персонажа

class Missions
{
    class DayZ
    {
        template = "{MISSION}";         // Миссия по умолчанию (перекрывается ключом -mission)
    };
};

verifySignatures = 0;                   // 0 — без проверки подписей (для отладки, офиц. умолч. 2)
forceSameBuild = 0;                     // Пускать любые сборки клиента (для отладки, офиц. умолч. 1)

serverTime = "2012/07/15/11/00";        // Стартовое время (ГГГГ/ММ/ДД/ЧЧ/ММ), "SystemTime" — системное
serverTimeAcceleration = 1;             // Ускорение времени (0.1-64)
serverNightTimeAcceleration = 1;        // Доп. ускорение ночи (множитель к serverTimeAcceleration)
serverTimePersistent = 0;               // Не сохранять время между рестартами

timeStampFormat = "Short";              // Формат таймштампов в RPT: Full/Short
logAverageFps = 5;                      // Средний FPS сервера каждые N сек (нужен -doLogs)
logMemory = 6;                          // Потребление памяти каждые N сек (нужен -doLogs)
logPlayers = 7;                         // Число игроков каждые N сек (нужен -doLogs)
logFile = "server_console.log";         // Файл консольного лога сервера в папке профиля

adminLogPlayerHitsOnly = 0;             // 1 — только попадания по игрокам, 0 — все попадания
adminLogPlacement = 0;                  // Логировать установку ловушек и палаток
adminLogBuildActions = 0;               // Логировать действия базостроения
adminLogPlayerList = 0;                 // Периодический список игроков с позициями (раз в 5 мин)

shotValidation = 1;                     // Валидация выстрелов: 1 — включена, 0 — выключена

disable3rdPerson = 0;                   // Вид от третьего лица
disableCrosshair = 0;                   // Прицел

steamQueryPort = 2305;                  // Порт Steam Query (обычно порт+2)
clientPort = 2304;                      // Принудительный порт для подключения клиентов
allowFilePatching = 1;                  // Разрешить клиентов с -filePatching (отладка сорсов)

lightingConfig = 0;                     // 0 — яркая ночь, 1 — тёмная, 2 — вариант Сахала
disablePersonalLight = 1;               // Отключить персональную подсветку у всех клиентов

enableWhitelist = 0;                    // Вайтлист (0-1)
disableBanlist = false;                 // Не использовать ban.txt
disablePrioritylist = false;            // Не использовать priority.txt

disableVoN = 0;                         // Голосовой чат
vonCodecQuality = 20;                   // Качество кодека голоса (0-20)

guaranteedUpdates = 1;                  // Протокол связи с сервером (только 1)
loginQueueConcurrentPlayers = 5;        // Игроков одновременно обрабатывается при входе
loginQueueMaxPlayers = 500;             // Максимум игроков в очереди на вход
instanceId = 1;                         // Идентификатор инстанса (storage_<id>)
storageAutoFix = 1;                     // Автопочинка битого persistence-файла

respawnTime = 5;                        // Задержка (сек) перед новым персонажем после смерти

motd[] = { };                           // Сообщение дня (строки через запятую)
motdInterval = 1;                       // Интервал (сек) между сообщениями motd

disableMultiAccountMitigation = false;  // Защита от мультиаккаунтов (консоли)

simulatedPlayersBatch = 20;             // Лимит игроков, симулируемых за один кадр сервера
multithreadedReplication = 1;           // Многопоточная репликация (потоки — из dayzsettings.xml)
speedhackDetection = 1;                 // Детект спидхака: 1 — строгий … 10 — мягкий

networkRangeClose = 20;                 // Сетевой пузырь (м): ближние объекты с предметами внутри
networkRangeNear = 150;                 // Сетевой пузырь (м): ближние предметы инвентаря
networkRangeFar = 1000;                 // Сетевой пузырь (м): дальние объекты
networkRangeDistantEffect = 4000;       // Сетевой пузырь (м): эффекты (звуки)

// Тонкая настройка сетевого батчинга объектов
networkObjectBatchLogSlow = 5;                       // Порог (сек) для лога медленной обработки "пузыря"
networkObjectBatchEnforceBandwidthLimits = 1;        // Ограничивать создание объектов по каналу
networkObjectBatchUseEstimatedBandwidth = 0;         // 0 — реальные данные, 1 — оценка
networkObjectBatchUseDynamicMaximumBandwidth = 1;    // Лимит — доля от текущего максимума
networkObjectBatchBandwidthLimit = 0.8;              // Сам лимит (доля [0,1] или число [1,∞))
networkObjectBatchCompute = 1000;                    // Объектов на создание/удаление за кадр
networkObjectBatchSendCreate = 10;                   // Максимум объектов на создание за кадр
networkObjectBatchSendDelete = 10;                   // Максимум объектов на удаление за кадр

defaultVisibility = 1375;               // Максимальная дальность отрисовки террейна на сервере
defaultObjectViewDistance = 1375;       // Максимальная дальность отрисовки объектов на сервере

disableBaseDamage = 0;                  // Урон по базам (заборы, вышки)
disableContainerDamage = 0;             // Урон по контейнерам (палатки, бочки, ящики)
disableRespawnDialog = 0;               // Диалог выбора точки респауна

pingWarning = 350;                      // Пинг (мс), при котором жёлтое предупреждение
pingCritical = 500;                     // Пинг (мс), при котором красное предупреждение
MaxPing = 500;                          // Пинг (мс), при котором игрока кикает с сервера
serverFpsWarning = 15;                  // FPS сервера, ниже которого предупреждение (минимум 11)

vppDisablePassword = 1;                 // Отключение требования пароля для VPPA