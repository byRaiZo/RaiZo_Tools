# Набор правил ruff, закреплённый явно.
#
# Без этого файла ruff берёт правила по умолчанию, а они разные у разных версий
# и меняются со временем: один и тот же код то проходит проверку, то нет.
# Хуже другое. В коде есть «# noqa» со ссылками на конкретные правила и
# пояснениями, зачем сделано именно так. Запусти ruff с набором, в который эти
# правила не входят, — и RUF100 объявит такие «# noqa» лишними, а с --fix
# удалит их вместе с пояснениями. Это уже случалось и стоило двух десятков
# комментариев.
#
# Отсюда правило: проверка — «python -m ruff check .», без --select и без --fix.
#
# Набор нарочно про ошибки, а не про оформление. Сортировка импортов (I) и
# именование (N) не включены: проект пишет импорты по нескольку в строке и
# зовёт FluentIcon как FIF, следуя своей библиотеке, — полторы сотни правок
# ради единообразия ничего бы не улучшили.

line-length = 120
target-version = "py311"

# build и dist — сборка PyInstaller, там чужие исходники целиком;
# update и downloads — данные пользователя; Examples и виртуальные окружения
# содержат сторонний код, который не является частью RaiZo Tools.
exclude = [
    "build",
    "dist",
    "update",
    "downloads",
    "Examples",
    ".venv",
    ".venv-test",
]

[lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes: неиспользованное, неопределённое, затенённое
    "S",         # bandit: небезопасные вызовы
    "BLE",       # перехват Exception без разбора
    "RUF100",    # «# noqa», которые больше ничего не подавляют
]

# Всё перечисленное разобрано поимённо и оставлено сознательно.
ignore = [
    # Открытие http(s)-адресов. Все адреса собираем сами из известных хостов —
    # GitHub API и Steam Web API; схема из ответа сервера никуда не подставляется.
    "S310",
    # Запуск DayZ, DayZ Tools и помощника обновления. Аргументы передаются
    # списком, оболочка не участвует.
    "S603",
    # try/except/pass и /continue. Каждый такой блок снабжён пояснением:
    # недоступная сеть или битый ответ Steam не должны ронять обход списка.
    "S110", "S112",
    # assert в core/downloader — проверки инвариантов при разборе архива.
    "S101",
    # «0.0.0.0» в core/launcher — адрес привязки сервера DayZ из его конфига.
    "S104",
    # VPP_DISABLE_PASSWORD в core/admin_tools — имя ключа конфига, не пароль.
    "S105",
]

[lint.per-file-ignores]
# Ядро PBO Builder переносится из отдельного проекта без форматирующего
# рефакторинга, чтобы поведение standalone и встроенного backend не расходилось.
"core/pbobuilder/*.py" = ["E501", "BLE001", "S"]
